name: Windows Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build Windows executable
        shell: pwsh
        run: python build_windows.py

      - name: Smoke test executable startup
        shell: pwsh
        run: .\dist\AIYouTubeStudio\AIYouTubeStudio.exe --smoke-test

      - name: Package artifact zip
        shell: pwsh
        run: Compress-Archive -Path .\dist\AIYouTubeStudio\* -DestinationPath .\dist\AIYouTubeStudio-windows.zip -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIYouTubeStudio-windows
          path: dist/AIYouTubeStudio-windows.zip
